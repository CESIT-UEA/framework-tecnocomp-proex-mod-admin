<div class="container">
    <div class="senha-esquerda">
        <img src="assets/imgs/capa-de-login.svg" alt="capa login" class="image-login">
    </div>
    <div class="senha-direita">
        <div class="wrapper-container-direito">
            <div class="card-senha">
            <h1>Redefinir sua senha</h1>
            <p class="senha-validacao">Mín. 8 caracteres, com letra minúscula, número e símbolo.</p>
            <form id="form" class="forms" [formGroup]="redefinirSenha">
                <div class="senha-conteudo">
                    <label for="nova-senha">Nova senha <span class="senha-validacao">*</span></label>
                    <div class="input-senha">
                        <input [ngClass]="{'error-login': errorLogin}" [type]="hide ? 'password' : 'text'" id="senha"
                            name="senha" placeholder="Digite sua senha" formControlName="nova_senha">
                        <button type="button" class="icon" (click)="hide = !hide" [class.ativo]="!hide">
                            <mat-icon>
                                {{ hide ? "visibility_off" : "visibility" }}
                            </mat-icon>
                        </button>
                    </div>
                </div>

                <div class="senha-conteudo">
                    <label for="confirmar-senha">Confirmar nova senha <span class="senha-validacao">*</span></label>
                    <div class="input-senha">
                        <input [ngClass]="{'error-login': errorLogin}" [type]="hideDois ? 'password' : 'text'" id="senha"
                        name="senha" placeholder="Digite sua senha" formControlName="confirmar_senha">
                    <button type="button" class="icon" (click)="hideDois = !hideDois" [class.ativo]="!hideDois">
                        <mat-icon>
                            {{ hideDois ? "visibility_off" : "visibility" }}
                        </mat-icon>
                    </button>
                    </div>
                </div>

                <p class="campo-formulario invalid" *ngIf="
                    (redefinirSenha.get('nova_senha')?.errors?.['required'] ||
                    redefinirSenha.get('confirmar_senha')?.errors?.['required']) && submitted
              ">
                    Preencha todos os campos!
                </p>
                <p class="campo-formulario invalid" *ngIf="submitted && !isSenhaIgual && redefinirSenha.valid">
                    As senhas não são iguais!
                </p>

                <p *ngIf="
                    submitted && 
                    (!redefinirSenha.get('nova_senha')?.hasError('required') && !redefinirSenha.get('confirmar_senha')?.hasError('required')) &&
                    (
                        redefinirSenha.get('nova_senha')?.hasError('minlength') ||
                        redefinirSenha.get('nova_senha')?.hasError('senhaForte') ||
                        redefinirSenha.get('nova_senha')?.hasError('noOnlyWhitespace')
                    )" class="senha-validacao">
                    A senha não atende aos requisitos de segurança.
            </p>

                <div class="senha-conteudo">
                    <div class="buttons">
                        <div class="wrapper-redefinir">
                            <button class="botao-redefinir" (click)="submit()">Redefinir</button>
                        </div>
                        <div class="wrapper">
                            <button class="botao-cancelar" routerLink="/login">Cancelar</button>
                        </div>
                    </div>
                </div>

            </form>
        </div>
        </div>
    </div>
</div>

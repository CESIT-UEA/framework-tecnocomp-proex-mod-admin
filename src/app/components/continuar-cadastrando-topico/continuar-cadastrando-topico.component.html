<h2 class="titulo">{{ data?.titulo }}</h2>
<mat-dialog-content>
  <p class="mensagem"><span>{{ data?.mensagem }}</span></p>
</mat-dialog-content>

<mat-dialog-actions class="botoes">
  <div class="btn-wrapper">
    <button id="botao-um" (click)="cancelar()"><span>Cancelar</span></button>
  </div>
  
  <button id="botao-dois" (click)="confirmar()">Continuar</button>
</mat-dialog-actions>

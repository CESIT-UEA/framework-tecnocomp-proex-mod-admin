<app-header-voltar texto="Cadastrar Usuário"></app-header-voltar>
<div class="container-background">
  <div class="cadastro-usuario-pagina">
    <div class="container-wrapper">
      <div class="cadastro-usuario-container">
    <h2 class="cadastro-usuario-titulo">Cadastrar Usuário</h2>
    <p class="cadastro-usuario-aviso">* Indica campos obrigatórios</p>
  <form id="form" class="form" [formGroup]="cadastroForm" >
    <div class="campos">
      <div class="form-conteudo">
        <label for="Nome-usuario" class="cadastro-usuario-label">Nome<span> *</span></label>
        <input type="text" formControlName="nome" class="cadastro-usuario-input" id="nome" placeholder="Digite seu nome">
        <div
          *ngIf="
            cadastroForm.get('nome')?.invalid &&
            cadastroForm.get('nome')?.touched
          "
        >
          <small class="mensagem-validacao">
            Nome é obrigatório e deve ter pelo menos 4 caracteres.
          </small>
        </div>
      </div>
      <div class="form-conteudo">
        <label for="email" class="cadastro-usuario-label">Email<span> *</span></label>
        <input type="email" formControlName="email" class="cadastro-usuario-input" id="nome" placeholder="exemplo@gmail.com">
        <div
          *ngIf="
            cadastroForm.get('email')?.invalid &&
            cadastroForm.get('email')?.touched
          "
        >
          <small class="mensagem-validacao">
            Digite um Email válido.
          </small>
        </div>
      </div>

    </div>

    <div class="form-conteudo-tipo">
      <label for="tipo" class="cadastro-usuario-label tipo">Tipo de usuário<span> *</span></label>
      <div class="bloco1">
        <mat-radio-group class="radio-group" formControlName="tipo">
          <mat-radio-button class="check-professor" value="professor">Professor</mat-radio-button>
          <mat-radio-button *ngIf="isAdminUser()" class="check-administrador" value="adm">Administrador</mat-radio-button>
        </mat-radio-group>
        <mat-slide-toggle formControlName="ativo" name="ativo">
            Usuário ativo
        </mat-slide-toggle>
      </div>
      
    </div>
    <div class="buttons">
      <div class="btn-wrapper">
        <button (click)="voltarPagina()" id="botao-um"><span>Cancelar</span></button>
      </div>
          <button
              type="submit"
              id="botao-dois"
              (click)="onSubmit()"
            >
              Confirmar
          </button>
        </div>
